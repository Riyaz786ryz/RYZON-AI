name: Get RYZON AI Android SHA-1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold if missing
        working-directory: android-app
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.ryzonai --project-name ryzon_ai .
          fi

      - name: Resolve Flutter dependencies
        working-directory: android-app
        run: flutter pub get

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print Android signing fingerprints
        working-directory: android-app/android
        shell: bash
        run: |
          ./gradlew signingReport | tee "$GITHUB_WORKSPACE/signing-report.txt"
          echo "----- SHA-1 lines -----"
          grep -E 'SHA1:|SHA-1:' "$GITHUB_WORKSPACE/signing-report.txt" || true
