name: Check RYZON AI cloud backend
on:
  push:
    paths:
      - 'cloud-backend/**'
      - '.github/workflows/cloud-backend-check.yml'
  pull_request:
    paths:
      - 'cloud-backend/**'
      - '.github/workflows/cloud-backend-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: cloud-backend
        run: npm install --no-audit --no-fund
      - name: Check backend JavaScript syntax
        working-directory: cloud-backend
        run: npm run check
