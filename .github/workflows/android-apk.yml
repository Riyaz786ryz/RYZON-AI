name: Build RYZON AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold if missing
        working-directory: android-app
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.ryzonai --project-name ryzon_ai .
          fi

      - name: Configure Google Services Gradle plugin
        working-directory: android-app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = next((p for p in [Path("android/settings.gradle.kts"), Path("android/settings.gradle")] if p.exists()), None)
          app_gradle = next((p for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")] if p.exists()), None)
          if settings is None or app_gradle is None:
              raise SystemExit("Android Gradle scaffold is incomplete")

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              settings_text, count = re.subn(
                  r"(plugins\\s*\\{)",
                  r'\\1\\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  settings_text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not locate plugins block in settings.gradle")
              settings.write_text(settings_text)

          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text, count = re.subn(
                  r"(plugins\\s*\\{)",
                  r'\\1\\n    id("com.google.gms.google-services")',
                  app_text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not locate plugins block in app/build.gradle")
              app_gradle.write_text(app_text)
          PY

      - name: Set Android launcher app name
        working-directory: android-app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          source, count = re.subn(r'<application\b([^>]*)>', lambda m: '<application' + re.sub(r'android:label="[^"]*"', 'android:label="RYZON AI"', m.group(1)) + (' android:label="RYZON AI"' if 'android:label=' not in m.group(1) else '') + '>', source, count=1)
          if count != 1:
              raise SystemExit("Could not find Android application tag")
          manifest.write_text(source)
          PY

      - name: Install Flutter dependencies
        working-directory: android-app
        run: flutter pub get

      - name: Create Android debug keystore and print matching SHA-1
        working-directory: android-app
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cd android
          ./gradlew signingReport | tee "$GITHUB_WORKSPACE/signing-report.txt"
          echo "----- SHA-1 for this APK build -----"
          grep -E 'SHA1:|SHA-1:' "$GITHUB_WORKSPACE/signing-report.txt" | head -n 1

      - name: Build release APK
        working-directory: android-app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryzon-ai-android-apk
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
