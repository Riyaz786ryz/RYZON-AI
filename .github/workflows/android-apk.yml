name: Build RYZON AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold if missing
        working-directory: android-app
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.ryzonai --project-name ryzon_ai .
          fi

      - name: Set Android launcher app name
        working-directory: android-app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          source, count = re.subn(r'<application\\b([^>]*)>', lambda m: '<application' + re.sub(r'android:label="[^"]*"', 'android:label="RYZON AI"', m.group(1)) + (' android:label="RYZON AI"' if 'android:label=' not in m.group(1) else '') + '>', source, count=1)
          if count != 1:
              raise SystemExit("Could not find Android application tag")
          manifest.write_text(source)
          PY

      - name: Install Flutter dependencies
        working-directory: android-app
        run: flutter pub get

      - name: Build release APK
        working-directory: android-app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryzon-ai-android-apk
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
